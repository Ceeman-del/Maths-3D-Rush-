<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math 3D Rush</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      touch-action: none;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(#162b4a 0%, #4b78a8 48%, #101827 49%, #050912 100%);
    }

    /* Sky */
    .sun {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffd85c;
      top: 10%;
      right: 12%;
      box-shadow: 0 0 45px #ffd85c;
    }

    /* Road */
    .road {
      position: absolute;
      left: 50%;
      bottom: -10%;
      width: 120%;
      height: 75%;
      transform: translateX(-50%) perspective(500px) rotateX(35deg);
      background: #252a33;
      border-left: 7px solid #777;
      border-right: 7px solid #777;
    }

    .road::before,
    .road::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 100%;
      background: #eee;
      opacity: .8;
    }

    .road::before {
      left: 33%;
    }

    .road::after {
      right: 33%;
    }

    /* HUD */
    #hud {
      position: absolute;
      z-index: 10;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .stat {
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(8px);
      font-weight: bold;
    }

    /* Question */
    #questionBox {
      position: absolute;
      z-index: 20;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90%, 430px);
      text-align: center;
      padding: 16px;
      border-radius: 18px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(10px);
    }

    #question {
      font-size: clamp(24px, 6vw, 38px);
      font-weight: bold;
    }

    #message {
      margin-top: 6px;
      min-height: 20px;
      font-weight: bold;
    }

    /* Player */
    #player {
      position: absolute;
      z-index: 15;
      bottom: 16%;
      left: 50%;
      width: 55px;
      height: 80px;
      transform: translateX(-50%);
      transition: left .15s ease;
    }
